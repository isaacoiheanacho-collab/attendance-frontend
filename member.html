<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Details</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="container" id="memberContainer">
    <div class="card">
      <h2 id="memberName"></h2>
      <p id="memberReg"></p>
      <p id="joinedDate"></p>
      <div class="photo-section">
        <img id="profilePhoto" alt="Profile photo" style="display: none;">
        <div class="upload-area">
          <label for="photoInput" class="upload-label">Choose Photo</label>
          <input type="file" id="photoInput" accept="image/*">
          <button id="uploadBtn" disabled>Upload</button>
        </div>
      </div>
      <button id="confirmBtn">Confirm Attendance</button>
    </div>
  </div>
  <script type="module" src="js/member.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/js/serviceWorker.js');
    }
  </script>
</body>
</html>
